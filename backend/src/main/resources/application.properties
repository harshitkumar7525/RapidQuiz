spring.application.name=RapidQuiz

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGO_DATABASE:rapidquiz}
spring.mongodb.auto-index-creation=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

server.port=${PORT:8080}

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-32-characters}
management.health.mongodb.enabled=false